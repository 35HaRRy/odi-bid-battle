const KEY='odi-preparation-design-v1';let state=initial(),storageFailed=false;try{const saved=JSON.parse(sessionStorage.getItem(KEY));if(saved?.state?.version===1){state=saved.state;lang=saved.lang==='en'?'en':'tr'}}catch{}let search='',showErrors=false,editing=null,editImage='',uploadTarget=null,dragId=null;

function teamsView(){return pageTitle(t('teamsTitle'),t('teamsIntro'))+`<div id="balance-banner">${balanceBanner()}</div><div class="split">${state.teams.map((team,ti)=>`<section class="team-pane" aria-label="${esc(team.name)}"><div class="team-head"><button class="flag-button" data-upload="flag" data-team="${ti}" aria-label="${t('flag')}: ${esc(team.name)}"><img src="${team.flag}" alt=""></button><div class="team-heading-fields"><label>${t('teamName')}<input data-team-field="name" data-team="${ti}" value="${esc(team.name)}" aria-invalid="${!team.name.trim()}"></label><input class="slogan-input" data-team-field="slogan" data-team="${ti}" value="${esc(team.slogan)}" aria-label="${t('slogan')}: ${esc(team.name)}"></div></div><div class="member-columns"><span>${t('optional')}</span><span>${t('memberName')}</span><span>${t('initialGold')}</span><span>${t('actions')}</span></div><div class="member-list" tabindex="0" aria-label="${esc(team.name)}: ${t('members')}">${team.members.map(m=>`<div class="member-row" data-member-row="${m.id}"><button class="avatar" data-upload="avatar" data-team="${ti}" data-member="${m.id}" aria-label="${esc(m.name)}: ${t('avatar')}">${m.avatar?`<img src="${m.avatar}" alt="">`:esc(m.name.charAt(0)||'·')}</button><div><input data-member-field="name" data-team="${ti}" data-member="${m.id}" value="${esc(m.name)}" aria-label="${t('memberName')}: ${esc(m.name)}" aria-invalid="${!m.name.trim()}"><span class="field-error name-error">${m.name.trim()?'':t('requiredName')}</span></div><div><input type="number" min="1" step="1" data-member-field="gold" data-team="${ti}" data-member="${m.id}" value="${esc(m.gold)}" aria-label="${esc(m.name)}: ${t('initialGold')}" aria-invalid="${!validGold(m)}"><span class="field-error gold-error">${validGold(m)?'':t('invalidGold')}</span></div><div class="member-actions"><button class="icon-button" data-transfer="${m.id}" data-team="${ti}" aria-label="${esc(m.name)}: ${t('moveMember')}">${icon(ti===0?'right':'left')}</button><button class="icon-button" data-delete-member="${m.id}" data-team="${ti}" aria-label="${esc(m.name)}: ${t('removeMember')}">${icon('remove')}</button></div></div>`).join('')||`<p class="empty">${t('noMembers')}</p>`}</div><div class="team-end"><button class="secondary small-btn" data-add-member="${ti}">${t('addMember')}</button><span>${team.members.length} ${t('members')} · ${t('total')} <b id="team-total-${ti}">${total(team)}</b> ${t('gold')}</span></div></section>`).join('')}</div>`}
function balanceBanner(){const a=total(state.teams[0]),b=total(state.teams[1]),equal=a===b;return `<div class="balance-banner ${equal?'':'error'}" role="status"><div><strong>${t(equal?'balanced':'unbalanced')}</strong><p>${t('difference')}: ${Math.abs(a-b)} ${t('gold')}</p></div><div class="balance-total"><span><b>${a}</b> ${t('gold')}</span><span>/</span><span><b>${b}</b> ${t('gold')}</span></div></div>`}
function checks(){return [{key:'checkName',ok:!!state.name.trim(),step:0,field:'auction-name'},{key:'checkBattle',ok:!!state.battle&&!!imageUrl(),step:0},{key:'checkList',ok:state.selected.length>=4&&state.selected.length%2===0,step:1},{key:'checkCandidateNames',ok:!!state.listName.trim()&&state.selected.every(id=>find(id)?.name.trim()&&find(id)?.image),step:1},{key:'checkTeams',ok:state.teams.every(t=>t.name.trim()&&t.slogan.trim()&&t.flag),step:2},{key:'checkMembers',ok:state.teams.every(t=>t.members.length>0),step:2},{key:'checkGold',ok:state.teams.every(t=>t.members.every(m=>m.name.trim()&&validGold(m))),step:2},{key:'checkEqual',ok:total(state.teams[0])===total(state.teams[1]),step:2}]}
function reviewView(){const failures=checks().filter(c=>!c.ok);return pageTitle(t('reviewTitle'),t('reviewIntro'))+(showErrors&&failures.length?`<div class="error-summary" id="error-summary" tabindex="-1" role="alert"><h3>${t('errors')}</h3><ul>${failures.map(c=>`<li><a href="#${c.field||'content'}" data-fix="${c.step}" ${c.field?`data-field="${c.field}"`:''}>${t(c.key)}</a></li>`).join('')}</ul></div>`:'')+`<div class="review-grid"><div><section class="review-section"><header><h3>${t('steps')[0]}</h3><button class="quiet" data-step="0">${t('editSection')}</button></header><div class="review-detail"><img src="${imageUrl()}" alt=""><div><strong>${esc(battlefields.find(b=>b.id===state.battle).name)}</strong><p>${t(state.background?'backgroundCustom':'backgroundNote')}</p></div></div></section><section class="review-section"><header><h3>${t('steps')[1]}</h3><button class="quiet" data-step="1">${t('editSection')}</button></header><p class="description" style="margin-bottom:10px">${esc(state.listName)} · ${state.selected.length} ${t('candidates')}</p><div class="review-candidates" tabindex="0" aria-label="${t('steps')[1]}">${state.selected.map(id=>`<img src="${find(id).image}" alt="${esc(find(id).name)}" title="${esc(find(id).name)}">`).join('')}</div></section><section class="review-section"><header><h3>${t('steps')[2]}</h3><button class="quiet" data-step="2">${t('editSection')}</button></header><div class="review-teams">${state.teams.map(team=>`<div><strong>${esc(team.name)}</strong><p>${team.members.length} ${t('members')} · ${total(team)} ${t('gold')}</p><p>${esc(team.slogan)}</p></div>`).join('')}</div></section></div><aside class="checklist"><h3>${t('checks')}</h3>${checks().map(c=>`<div class="check ${c.ok?'':'invalid'}">${icon(c.ok?'check':'alert')}<span>${c.ok?t(c.key):`<a href="#content" data-fix="${c.step}">${t(c.key)}</a>`}</span></div>`).join('')}<p class="lock-note"><strong>${t('lock')}</strong><br>${t('lockText')}</p></aside></div>`}
function lockedView(){return `<section class="locked">${icon('tree')}<h2>${t('lockedTitle')}</h2><p>${t('lockedIntro')}</p><div class="locked-teams">${state.teams.map(team=>`<div class="locked-team"><img src="${team.flag}" alt=""><strong>${esc(team.name)}</strong><span>${esc(team.slogan)}</span><span>${team.members.length} ${t('members')} · ${total(team)} ${t('gold')}</span></div>`).join('')}</div><div class="locked-message">${esc(state.listName)} · ${state.selected.length} ${t('candidates')} · ${esc(battlefields.find(b=>b.id===state.battle).name)}</div></section>`}
function navigate(step){if(state.locked)return;state.step=step;showErrors=false;persist();render();document.querySelector('.section-title h2')?.setAttribute('tabindex','-1');document.querySelector('.section-title h2')?.focus({preventScroll:true});}
function focusMember(id){const el=document.querySelector(`[data-member-field="name"][data-member="${id}"]`);el?.focus();el?.scrollIntoView({block:'nearest'})}
function moveCandidate(id,delta){const i=state.selected.indexOf(id),j=i+delta;if(j<0||j>=state.selected.length)return;touchList();[state.selected[i],state.selected[j]]=[state.selected[j],state.selected[i]];persist();render();document.querySelector(`[data-move="${delta}"][data-id="${id}"]:not(:disabled)`)?.focus({preventScroll:true})}
document.addEventListener('click',event=>{const b=event.target.closest('button,a[data-fix]');if(!b)return;if(b.dataset.fix!==undefined){event.preventDefault();navigate(Number(b.dataset.fix));if(b.dataset.field)document.getElementById(b.dataset.field)?.focus();return}if(b.dataset.step!==undefined){navigate(Number(b.dataset.step));return}if(b.dataset.battle){state.battle=b.dataset.battle;persist();render();return}if(b.dataset.add){if(state.selected.includes(b.dataset.add))return;touchList();state.selected.push(b.dataset.add);persist();render();status(t('candidateAdded'));return}if(b.dataset.remove){touchList();state.selected=state.selected.filter(id=>id!==b.dataset.remove);persist();render();status(t('candidateRemoved'));return}if(b.dataset.move){moveCandidate(b.dataset.id,Number(b.dataset.move));return}if(b.dataset.edit){openEditor(b.dataset.edit);return}if(b.dataset.addMember!==undefined){const team=state.teams[Number(b.dataset.addMember)],member={id:uid(),name:'',gold:10,avatar:''};team.members.push(member);persist();render();focusMember(member.id);status(t('memberAdded'));return}if(b.dataset.transfer){const from=Number(b.dataset.team),team=state.teams[from],i=team.members.findIndex(m=>m.id===b.dataset.transfer);state.teams[1-from].members.push(team.members.splice(i,1)[0]);persist();render();focusMember(b.dataset.transfer);status(t('memberMoved'));return}if(b.dataset.deleteMember){const team=state.teams[Number(b.dataset.team)];team.members=team.members.filter(m=>m.id!==b.dataset.deleteMember);persist();render();return}if(b.dataset.upload){uploadTarget={type:b.dataset.upload,team:Number(b.dataset.team),member:b.dataset.member};document.getElementById('asset-upload').value='';document.getElementById('asset-upload').click();return}switch(b.dataset.action){case'next':navigate(Math.min(3,state.step+1));break;case'save-draft':persist();status(t(storageFailed?'saveError':'savedDraft'),storageFailed);break;case'new-candidate':openEditor();break;case'start':if(checks().some(c=>!c.ok)){showErrors=true;render();document.getElementById('error-summary').focus()}else{state.locked=true;persist();render();document.getElementById('content').setAttribute('tabindex','-1');document.getElementById('content').focus()}break;case'new-draft':state=structuredClone(state);state.locked=false;state.step=0;state.name+=' — '+(lang==='tr'?'Yeni taslak':'New draft');persist();render();status(t('newDraftMessage'));break;}});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='auction-name'){state.name=el.value;el.setAttribute('aria-invalid',String(!state.name.trim()));persist();if(state.step===3&&!state.locked)document.getElementById('content').innerHTML=reviewView();return}if(el.id==='candidate-search'){search=el.value;document.getElementById('catalog-grid').innerHTML=catalogItems();return}if(el.id==='list-name'){touchList();state.listName=el.value;document.getElementById('source-note').textContent=t('copied');document.getElementById('source-note').classList.add('copy-note');persist();return}if(el.dataset.teamField){state.teams[Number(el.dataset.team)][el.dataset.teamField]=el.value;el.setAttribute('aria-invalid',String(!el.value.trim()));persist();return}if(el.dataset.memberField){const team=state.teams[Number(el.dataset.team)],m=team.members.find(m=>m.id===el.dataset.member);m[el.dataset.memberField]=el.value;const row=el.closest('.member-row');row.querySelector('.gold-error').textContent=validGold(m)?'':t('invalidGold');row.querySelector('.name-error').textContent=m.name.trim()?'':t('requiredName');row.querySelector('[data-member-field=gold]').setAttribute('aria-invalid',String(!validGold(m)));row.querySelector('[data-member-field=name]').setAttribute('aria-invalid',String(!m.name.trim()));document.getElementById('balance-banner').innerHTML=balanceBanner();document.getElementById('team-total-'+el.dataset.team).textContent=total(team);persist();}});
document.getElementById('language').onchange=e=>{lang=e.target.value;persist();render()};
document.getElementById('reset').onclick=()=>{for(const[id,key]of [['reset-title','resetTitle'],['reset-description','resetDescription'],['cancel-reset','cancel'],['confirm-reset','reset']])document.getElementById(id).textContent=t(key);document.getElementById('reset-dialog').showModal();document.getElementById('cancel-reset').focus()};document.getElementById('cancel-reset').onclick=()=>document.getElementById('reset-dialog').close();document.getElementById('confirm-reset').onclick=()=>{state=initial();search='';showErrors=false;document.getElementById('reset-dialog').close();persist();render();status('')};
function openEditor(id=null){editing=id;editImage=id?find(id).image:emblem(state.catalog.length);document.getElementById('editor-title').textContent=t(id?'editCandidate':'newCandidate');document.getElementById('editor-description').textContent=t(id?'candidateCopy':'newCandidateDescription');for(const[el,key]of [['candidate-name-label','candidateName'],['candidate-image-label','candidateImage'],['candidate-image-note','sampleKeep'],['close-editor','cancel'],['save-candidate','save']])document.getElementById(el).textContent=t(key);document.getElementById('candidate-name').value=id?find(id).name:'';document.getElementById('candidate-image').value='';document.getElementById('candidate-preview').src=editImage;document.getElementById('candidate-preview').alt=t('sampleImage');document.getElementById('editor').showModal();document.getElementById('candidate-name').focus()}
document.getElementById('close-editor').onclick=()=>document.getElementById('editor').close();document.getElementById('editor-form').onsubmit=e=>{e.preventDefault();const name=document.getElementById('candidate-name').value.trim();if(!name)return;const candidate={id:uid(),name,image:editImage};state.catalog.push(candidate);if(editing&&state.selected.includes(editing)){touchList();state.selected=state.selected.map(id=>id===editing?candidate.id:id)}document.getElementById('editor').close();persist();render();};
async function readImage(file){if(!file||!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))throw Error('format');const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=reject;img.src=url});return url}
document.getElementById('candidate-image').onchange=async e=>{if(!e.target.files[0])return;try{editImage=await readImage(e.target.files[0]);document.getElementById('candidate-preview').src=editImage}catch{document.getElementById('candidate-image-note').textContent=t('assetError')}};
document.getElementById('asset-upload').onchange=async e=>{if(!e.target.files[0])return;try{const image=await readImage(e.target.files[0]);if(uploadTarget.type==='background')state.background=image;if(uploadTarget.type==='battle')state.battleImages[state.battle]=image;if(uploadTarget.type==='flag')state.teams[uploadTarget.team].flag=image;if(uploadTarget.type==='avatar')state.teams[uploadTarget.team].members.find(m=>m.id===uploadTarget.member).avatar=image;persist();render();status(t('imageUpdated'))}catch{status(t('assetError'),true)}};
function bindDrag(){document.querySelectorAll('.ordered-item').forEach(row=>{row.ondragstart=e=>{dragId=row.dataset.id;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'};row.ondragover=e=>{e.preventDefault();row.classList.add('drag-over')};row.ondragleave=()=>row.classList.remove('drag-over');row.ondragend=()=>{dragId=null;document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'))};row.ondrop=e=>{e.preventDefault();const from=state.selected.indexOf(dragId),to=state.selected.indexOf(row.dataset.id);if(from<0||to<0||from===to)return;touchList();state.selected.splice(to,0,state.selected.splice(from,1)[0]);dragId=null;persist();render()}})}
render();persist();
</script><script src="/files/full-prototype.js"></script></body></html>
